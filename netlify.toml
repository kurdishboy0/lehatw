[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
  ignore = 'git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../netlify.toml'

# Public OAuth client identifier; never put client secrets in frontend settings.
[build.environment]
  VITE_GOOGLE_CLIENT_ID = "868804339083-pdfhjanimo8sk7e8r3i9p36tvr3gngep.apps.googleusercontent.com"


# Send API requests to the Express service, before the React page fallback.
[[redirects]]
  from = "/api/*"
  to = "https://lehatw.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://lehatw.onrender.com/uploads/:splat"
  status = 200
  force = true

# Keep React Router pages working when opened directly or refreshed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
